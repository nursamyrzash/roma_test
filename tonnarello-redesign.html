<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tonnarello — Trastevere, Roma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Newsreader:ital,wght@0,500;1,500;1,600&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --linen:#F7F1E3;
    --linen-dim:#EFE6D2;
    --ink:#221C16;
    --ink-soft:#5C5347;
    --sugo:#C1361D;
    --sugo-dim:#A32C17;
    --gold:#E3A73B;
    --basil:#4B6B3A;
    --panel:#1B1611;
    --line:rgba(34,28,22,0.14);
    --paper:#FFFDF8;
    --radius:3px;
    --f-display:"Anton", sans-serif;
    --f-accent:"Newsreader", serif;
    --f-body:"Inter", sans-serif;
    --f-mono:"Space Mono", monospace;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0; background:var(--linen); color:var(--ink); font-family:var(--f-body); -webkit-font-smoothing:antialiased;}
  a{color:inherit;} img{max-width:100%; display:block;} button{font-family:inherit;}
  :focus-visible{outline:2px solid var(--sugo); outline-offset:3px;}

  @media (prefers-reduced-motion: no-preference){
    .fade-up{opacity:0; transform:translateY(16px); transition:opacity .6s ease, transform .6s ease;}
    .fade-up.in{opacity:1; transform:translateY(0);}
  }
  @media (prefers-reduced-motion: reduce){ .fade-up{opacity:1; transform:none;} }

  .eyebrow{
    font-family:var(--f-mono); font-size:.72rem; text-transform:uppercase; letter-spacing:.16em;
    color:var(--sugo); display:flex; align-items:center; gap:8px;
  }
  .eyebrow::before{content:""; width:18px; height:2px; background:var(--sugo);}

  /* ---------- Top bar ---------- */
  .topbar{
    position:sticky; top:0; z-index:40; display:flex; align-items:center; justify-content:space-between;
    padding:16px 22px; background:rgba(247,241,227,0.92); backdrop-filter:blur(6px); border-bottom:1px solid var(--line);
  }
  .brand{font-family:var(--f-display); font-size:1.35rem; letter-spacing:.02em;}
  .brand span{color:var(--sugo);}
  .topnav{display:flex; align-items:center; gap:26px;}
  .topnav a{font-size:.85rem; font-weight:600; text-decoration:none; color:var(--ink-soft);}
  .topnav a:hover{color:var(--sugo);}
  @media(max-width:800px){.topnav .navlinks{display:none;}}
  .langswitch{display:flex; gap:2px; font-family:var(--f-mono); font-size:.72rem;}
  .langswitch button{background:none; border:1px solid var(--line); color:var(--ink-soft); padding:6px 10px; cursor:pointer; border-radius:var(--radius);}
  .langswitch button[aria-pressed="true"]{background:var(--sugo); border-color:var(--sugo); color:var(--paper);}

  /* ---------- Hero ---------- */
  .hero{position:relative; padding:70px 22px 60px; text-align:center; overflow:hidden;}
  .hero::before{
    content:""; position:absolute; inset:0;
    background:
      radial-gradient(circle at 15% 20%, rgba(227,167,59,0.22), transparent 45%),
      radial-gradient(circle at 85% 0%, rgba(193,54,29,0.14), transparent 50%);
    pointer-events:none;
  }
  .hero-tag{margin-bottom:22px; display:flex; justify-content:center;}
  .hero h1{
    font-family:var(--f-display); font-weight:400; line-height:.92; margin:0 0 18px;
    font-size:clamp(3rem, 12vw, 6.4rem); letter-spacing:.005em; text-transform:uppercase;
  }
  .hero h1 em{font-style:normal; color:var(--sugo);}
  .hero .sub{
    font-family:var(--f-accent); font-style:italic; font-weight:500; font-size:clamp(1.05rem,2.6vw,1.35rem);
    color:var(--ink-soft); max-width:44ch; margin:0 auto 34px; line-height:1.5;
  }
  .hero-ctas{display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-bottom:30px;}
  .btn{
    display:inline-flex; align-items:center; gap:9px; padding:15px 28px; border-radius:var(--radius);
    font-weight:700; font-size:.9rem; letter-spacing:.02em; text-transform:uppercase; text-decoration:none;
    border:1.5px solid transparent; cursor:pointer; transition:transform .15s ease;
  }
  .btn:hover{transform:translateY(-2px);}
  .btn-primary{background:var(--sugo); color:var(--paper); box-shadow:0 8px 20px -8px rgba(193,54,29,0.5);}
  .btn-primary:hover{background:var(--sugo-dim);}
  .btn-ghost{background:transparent; color:var(--ink); border-color:var(--ink);}
  .btn-ghost:hover{border-color:var(--sugo); color:var(--sugo);}
  .btn-dark{background:var(--panel); color:var(--linen);}
  .hero-meta{
    display:flex; justify-content:center; gap:26px; flex-wrap:wrap;
    font-family:var(--f-mono); font-size:.78rem; color:var(--ink-soft);
  }

  section{padding:80px 22px; max-width:1000px; margin:0 auto;}
  .section-head{margin-bottom:36px;}
  .section-head h2{font-family:var(--f-display); text-transform:uppercase; font-weight:400; font-size:clamp(1.9rem,5vw,2.6rem); margin:14px 0 10px; letter-spacing:.01em;}
  .section-head p{color:var(--ink-soft); max-width:56ch; line-height:1.6; font-size:1rem;}
  .center{text-align:center; margin-left:auto; margin-right:auto;}
  .section-head.center p{margin-left:auto; margin-right:auto;}

  /* ---------- La Fila / crowd guide (SIGNATURE) ---------- */
  .fila{background:var(--panel); color:var(--linen); border-radius:var(--radius);}
  .fila-inner{padding:52px 26px;}
  .fila .eyebrow{color:var(--gold);}
  .fila .eyebrow::before{background:var(--gold);}
  .fila h2{color:var(--linen);}
  .fila p.lead{color:rgba(247,241,227,0.72); max-width:60ch; line-height:1.6; margin:0 0 40px;}
  .ticket{
    display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:14px;
    font-family:var(--f-mono); border-bottom:1px dashed rgba(247,241,227,0.25); padding-bottom:18px; margin-bottom:28px;
  }
  .ticket .now{font-size:.78rem; text-transform:uppercase; letter-spacing:.1em; color:rgba(247,241,227,0.55);}
  .ticket .rec{font-size:1.05rem; color:var(--gold); font-weight:700;}
  .crowd-chart{display:flex; align-items:flex-end; gap:5px; height:130px; margin-bottom:14px;}
  .crowd-bar{flex:1; background:rgba(247,241,227,0.14); border-radius:2px 2px 0 0; position:relative; min-height:6px; cursor:default;}
  .crowd-bar.low{background:rgba(75,107,58,0.55);}
  .crowd-bar.med{background:rgba(227,167,59,0.55);}
  .crowd-bar.high{background:rgba(193,54,29,0.75);}
  .crowd-bar .lbl{
    position:absolute; bottom:-24px; left:50%; transform:translateX(-50%);
    font-family:var(--f-mono); font-size:.62rem; color:rgba(247,241,227,0.5); white-space:nowrap;
  }
  .crowd-legend{display:flex; gap:20px; margin-top:32px; flex-wrap:wrap; font-family:var(--f-mono); font-size:.72rem; color:rgba(247,241,227,0.65);}
  .crowd-legend span{display:inline-flex; align-items:center; gap:6px;}
  .dot{width:9px; height:9px; border-radius:50%;}
  .fila-note{font-size:.78rem; color:rgba(247,241,227,0.45); margin-top:22px; font-family:var(--f-mono);}

  /* ---------- Chi siamo ---------- */
  .about-wrap{display:grid; grid-template-columns:1fr 1fr; gap:40px; align-items:center;}
  @media(max-width:760px){.about-wrap{grid-template-columns:1fr;}}
  .about-copy p{line-height:1.7; color:var(--ink-soft); font-size:1rem; margin:0 0 16px;}
  .about-quote{
    font-family:var(--f-accent); font-style:italic; font-size:1.2rem; color:var(--ink);
    border-left:3px solid var(--sugo); padding-left:18px; margin:22px 0;
  }
  .about-visual{aspect-ratio:4/5; border-radius:var(--radius); background:
      linear-gradient(160deg, var(--gold) 0%, var(--sugo) 55%, var(--panel) 130%);
      position:relative; overflow:hidden;}
  .about-visual::after{content:"5 SALE"; position:absolute; bottom:20px; left:20px; font-family:var(--f-mono); color:rgba(255,255,255,0.85); font-size:.8rem; letter-spacing:.1em;}

  .why-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:22px; margin-top:40px;}
  @media(max-width:720px){.why-grid{grid-template-columns:1fr;}}
  .why-card{background:var(--paper); border:1px solid var(--line); padding:26px 22px; border-radius:var(--radius);}
  .why-card .num{font-family:var(--f-mono); color:var(--sugo); font-size:.8rem; margin-bottom:10px; display:block;}
  .why-card h3{font-family:var(--f-display); font-weight:400; text-transform:uppercase; font-size:1.15rem; margin:0 0 8px;}
  .why-card p{color:var(--ink-soft); font-size:.9rem; line-height:1.55; margin:0;}

  /* ---------- Dishes ---------- */
  .dish-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:18px; margin-top:40px;}
  @media(max-width:820px){.dish-grid{grid-template-columns:1fr 1fr;}}
  @media(max-width:520px){.dish-grid{grid-template-columns:1fr;}}
  .dish-card{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;}
  .dish-visual{height:110px; position:relative;}
  .dish-body{padding:16px 18px 20px;}
  .dish-body h3{font-family:var(--f-display); font-weight:400; text-transform:uppercase; font-size:1.05rem; margin:0 0 6px; letter-spacing:.01em;}
  .dish-body p{color:var(--ink-soft); font-size:.83rem; line-height:1.5; margin:0 0 12px;}
  .dish-price{font-family:var(--f-mono); font-weight:700; color:var(--sugo); font-size:.9rem; border-top:1px dashed var(--line); padding-top:10px;}
  .dish-flag{position:absolute; top:10px; left:10px; background:var(--panel); color:var(--gold); font-family:var(--f-mono); font-size:.62rem; padding:3px 8px; border-radius:2px; letter-spacing:.06em; text-transform:uppercase;}

  /* ---------- Menu ---------- */
  .menu-tabs{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px;}
  .menu-tab{background:var(--paper); border:1px solid var(--line); padding:10px 18px; border-radius:999px; font-size:.85rem; font-weight:600; cursor:pointer; color:var(--ink-soft);}
  .menu-tab[aria-selected="true"]{background:var(--sugo); border-color:var(--sugo); color:var(--paper);}
  .menu-panel{display:none; border-top:1px solid var(--line); margin-top:20px;}
  .menu-panel.active{display:block;}
  .menu-item{display:flex; justify-content:space-between; gap:16px; padding:16px 2px; border-bottom:1px solid var(--line);}
  .menu-item-name{font-weight:700; font-size:.98rem;}
  .menu-item-desc{color:var(--ink-soft); font-size:.85rem; margin-top:3px; line-height:1.5;}
  .menu-item-price{font-family:var(--f-mono); font-weight:700; color:var(--sugo); white-space:nowrap;}
  .menu-note{font-size:.78rem; color:var(--ink-soft); margin-top:18px; font-family:var(--f-mono);}

  /* ---------- Gallery ---------- */
  .gallery-grid{display:grid; grid-template-columns:repeat(4,1fr); grid-auto-rows:110px; gap:10px; margin-top:36px;}
  @media(max-width:720px){.gallery-grid{grid-template-columns:repeat(2,1fr);}}
  .gallery-tile{border-radius:var(--radius);}
  .gallery-tile:nth-child(1){grid-row:span 2; background:linear-gradient(150deg,#C1361D,#E3A73B);}
  .gallery-tile:nth-child(2){background:linear-gradient(150deg,#4B6B3A,#221C16);}
  .gallery-tile:nth-child(3){background:linear-gradient(150deg,#E3A73B,#C1361D);}
  .gallery-tile:nth-child(4){grid-row:span 2; background:linear-gradient(150deg,#221C16,#4B6B3A);}
  .gallery-tile:nth-child(5){background:linear-gradient(150deg,#C1361D,#221C16);}
  .gallery-tile:nth-child(6){background:linear-gradient(150deg,#E3A73B,#4B6B3A);}
  .gallery-tile:nth-child(7){background:linear-gradient(150deg,#4B6B3A,#C1361D);}

  /* ---------- Locations ---------- */
  .loc-tabs{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:26px;}
  .loc-tab{background:var(--paper); border:1px solid var(--line); padding:9px 14px; border-radius:var(--radius); font-size:.8rem; font-weight:600; cursor:pointer; color:var(--ink-soft); text-align:left;}
  .loc-tab[aria-selected="true"]{background:var(--panel); border-color:var(--panel); color:var(--gold);}
  .loc-panel{display:none; background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:28px;}
  .loc-panel.active{display:grid; grid-template-columns:1fr 1fr; gap:24px; align-items:center;}
  @media(max-width:640px){.loc-panel.active{grid-template-columns:1fr;}}
  .loc-panel address{font-style:normal; font-size:1.15rem; font-weight:600; line-height:1.5; margin-bottom:10px;}
  .loc-hours{font-family:var(--f-mono); font-size:.85rem; color:var(--ink-soft); margin-bottom:18px;}
  .loc-walkin{display:inline-flex; align-items:center; gap:8px; font-size:.82rem; color:var(--sugo); font-weight:600; margin-bottom:20px;}
  .loc-map-visual{aspect-ratio:4/3; border-radius:var(--radius); background:
      repeating-linear-gradient(0deg, transparent, transparent 20px, var(--line) 21px),
      repeating-linear-gradient(90deg, transparent, transparent 20px, var(--line) 21px), var(--linen-dim);
      display:flex; align-items:center; justify-content:center;}
  .loc-pin{width:30px; height:30px; border-radius:50% 50% 50% 0; background:var(--sugo); transform:rotate(-45deg); box-shadow:0 6px 14px -4px rgba(193,54,29,0.5);}

  /* ---------- Reviews ---------- */
  .review-box{background:var(--panel); color:var(--linen); border-radius:var(--radius); padding:44px 30px; text-align:center;}
  .review-box .stars{color:var(--gold); font-size:1.3rem; letter-spacing:3px; margin-bottom:16px;}
  .review-box p{color:rgba(247,241,227,0.75); max-width:52ch; margin:0 auto 26px; line-height:1.6;}

  /* ---------- Footer ---------- */
  footer{background:var(--linen-dim); border-top:1px solid var(--line); padding:56px 22px 110px;}
  .footer-inner{max-width:1000px; margin:0 auto; display:grid; grid-template-columns:1.3fr 1fr 1fr; gap:32px;}
  @media(max-width:680px){.footer-inner{grid-template-columns:1fr;}}
  .footer-inner h4{font-family:var(--f-display); font-weight:400; text-transform:uppercase; font-size:1.1rem; margin:0 0 12px;}
  .footer-links{list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:9px; font-size:.88rem;}
  .footer-links a{text-decoration:none; color:var(--ink-soft);}
  .footer-links a:hover{color:var(--sugo);}
  .footer-legal{max-width:1000px; margin:36px auto 0; padding-top:22px; border-top:1px solid var(--line); font-size:.78rem; color:var(--ink-soft); display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;}

  /* ---------- Sticky mobile bar ---------- */
  .sticky-bar{position:fixed; bottom:0; left:0; right:0; z-index:50; display:none; background:var(--paper); border-top:1px solid var(--line); box-shadow:0 -6px 20px -10px rgba(0,0,0,0.25);}
  .sticky-bar-inner{display:flex;}
  .sticky-bar a{flex:1; text-align:center; padding:14px 8px; font-weight:700; font-size:.82rem; text-decoration:none; text-transform:uppercase; display:flex; align-items:center; justify-content:center; gap:7px;}
  .sticky-bar a:first-child{color:var(--ink); border-right:1px solid var(--line);}
  .sticky-bar a:last-child{color:var(--paper); background:var(--sugo);}
  @media(max-width:680px){.sticky-bar{display:block;} body{padding-bottom:58px;}}
</style>
</head>
<body>

<!-- ============================================================
  Redesign demo for Locanda Tonnarello (tonnarello.it), built from
  their real published info: 6 locations, no-reservation / walk-in
  policy, PDF-only menus, and their own "la fila" (the line) joke.
  Placeholder pricing — swap in real menu prices before sending live.
============================================================= -->

<header class="topbar">
  <div class="brand">TONNAR<span>ELLO</span></div>
  <nav class="topnav">
    <div class="navlinks">
      <a href="#chisiamo" data-i18n="nav.about"></a>
      <a href="#menu" data-i18n="nav.menu"></a>
      <a href="#sedi" data-i18n="nav.locations"></a>
      <a href="#recensioni" data-i18n="nav.reviews"></a>
    </div>
    <div class="langswitch" role="group" aria-label="Language" style="margin-left:20px;">
      <button data-lang="it" aria-pressed="true">IT</button>
      <button data-lang="en" aria-pressed="false">EN</button>
    </div>
  </nav>
</header>

<main>
  <section class="hero">
    <div class="hero-tag"><span class="eyebrow" data-i18n="hero.eyebrow"></span></div>
    <h1 data-i18n-html="hero.title"></h1>
    <p class="sub" data-i18n="hero.sub"></p>
    <div class="hero-ctas">
      <a class="btn btn-primary" href="#menu" data-i18n="hero.ctaMenu"></a>
      <a class="btn btn-ghost" href="#fila" data-i18n="hero.ctaWhen"></a>
    </div>
    <div class="hero-meta">
      <span data-i18n="hero.meta1"></span>
      <span data-i18n="hero.meta2"></span>
      <span data-i18n="hero.meta3"></span>
    </div>
  </section>

  <section id="fila" class="fila fade-up">
    <div class="fila-inner">
      <span class="eyebrow" data-i18n="fila.eyebrow"></span>
      <h2 data-i18n="fila.title"></h2>
      <p class="lead" data-i18n="fila.lead"></p>
      <div class="ticket">
        <span class="now" data-i18n="fila.nowLabel"></span>
        <span class="rec" id="filaRec"></span>
      </div>
      <div class="crowd-chart" id="crowdChart"></div>
      <div class="crowd-legend">
        <span><span class="dot" style="background:var(--basil)"></span><span data-i18n="fila.low"></span></span>
        <span><span class="dot" style="background:var(--gold)"></span><span data-i18n="fila.med"></span></span>
        <span><span class="dot" style="background:var(--sugo)"></span><span data-i18n="fila.high"></span></span>
      </div>
      <p class="fila-note" data-i18n="fila.note"></p>
    </div>
  </section>

  <section id="chisiamo">
    <div class="about-wrap">
      <div class="about-visual fade-up"></div>
      <div class="about-copy fade-up">
        <span class="eyebrow" data-i18n="about.eyebrow"></span>
        <h2 data-i18n="about.title"></h2>
        <p data-i18n="about.p1"></p>
        <p data-i18n="about.p2"></p>
        <div class="about-quote" data-i18n="about.quote"></div>
      </div>
    </div>
    <div class="why-grid">
      <div class="why-card fade-up"><span class="num">01</span><h3 data-i18n="why.card1.title"></h3><p data-i18n="why.card1.body"></p></div>
      <div class="why-card fade-up"><span class="num">02</span><h3 data-i18n="why.card2.title"></h3><p data-i18n="why.card2.body"></p></div>
      <div class="why-card fade-up"><span class="num">03</span><h3 data-i18n="why.card3.title"></h3><p data-i18n="why.card3.body"></p></div>
    </div>
  </section>

  <section id="piatti">
    <div class="section-head fade-up">
      <span class="eyebrow" data-i18n="dishes.eyebrow"></span>
      <h2 data-i18n="dishes.title"></h2>
      <p data-i18n="dishes.body"></p>
    </div>
    <div class="dish-grid" id="dishGrid"></div>
  </section>

  <section id="menu">
    <div class="section-head fade-up">
      <span class="eyebrow" data-i18n="menu.eyebrow"></span>
      <h2 data-i18n="menu.title"></h2>
      <p data-i18n="menu.body"></p>
    </div>
    <div class="menu-tabs" id="menuTabs"></div>
    <div id="menuPanels"></div>
    <p class="menu-note" data-i18n="menu.note"></p>
  </section>

  <section id="galleria">
    <div class="section-head fade-up">
      <span class="eyebrow" data-i18n="gallery.eyebrow"></span>
      <h2 data-i18n="gallery.title"></h2>
    </div>
    <div class="gallery-grid" aria-hidden="true">
      <div class="gallery-tile"></div><div class="gallery-tile"></div><div class="gallery-tile"></div>
      <div class="gallery-tile"></div><div class="gallery-tile"></div><div class="gallery-tile"></div><div class="gallery-tile"></div>
    </div>
  </section>

  <section id="sedi">
    <div class="section-head fade-up">
      <span class="eyebrow" data-i18n="loc.eyebrow"></span>
      <h2 data-i18n="loc.title"></h2>
      <p data-i18n="loc.body"></p>
    </div>
    <div class="loc-tabs" id="locTabs"></div>
    <div id="locPanels"></div>
  </section>

  <section id="recensioni">
    <div class="review-box fade-up">
      <div class="stars">★★★★★</div>
      <p data-i18n="reviews.body"></p>
      <a class="btn btn-primary" id="tripadvisorBtn" target="_blank" rel="noopener" data-i18n="reviews.cta"></a>
    </div>
  </section>
</main>

<footer>
  <div class="footer-inner">
    <div>
      <h4>TONNARELLO</h4>
      <p style="color:var(--ink-soft); font-size:.88rem; line-height:1.6;" data-i18n="footer.tag"></p>
    </div>
    <div>
      <ul class="footer-links">
        <li style="color:var(--ink-soft); font-size:.78rem; text-transform:uppercase; letter-spacing:.08em;" data-i18n="footer.linksTitle"></li>

let lang = "it";
function t(key){ return COPY[lang][key] || ""; }
function bi(field){ return typeof field === "object" ? field[lang] : field; }

function renderStatic(){
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el=>{ const v=t(el.dataset.i18n); if(v) el.textContent=v; });
  document.querySelectorAll("[data-i18n-html]").forEach(el=>{ const v=t(el.dataset.i18nHtml); if(v) el.innerHTML=v; });

  // dishes
  document.getElementById("dishGrid").innerHTML = DISHES.map((d,i)=>`
    <div class="dish-card">
      <div class="dish-visual" style="background:linear-gradient(135deg, ${i%3===0?'#C1361D,#E3A73B':i%3===1?'#4B6B3A,#221C16':'#E3A73B,#C1361D'})">
        ${d.flag ? `<span class="dish-flag">${d.flag}</span>` : ""}
      </div>
      <div class="dish-body">
        <h3>${d.name}</h3>
        <p>${bi(d.desc)}</p>
        <div class="dish-price">${d.price}</div>
      </div>
    </div>
  `).join("");

  // menu tabs
  const menuKeys = Object.keys(MENU);
  document.getElementById("menuTabs").innerHTML = menuKeys.map((k,i)=>`
    <button class="menu-tab" role="tab" aria-selected="${i===0}" data-key="${k}">${bi(MENU[k].label)}</button>
  `).join("");
  document.getElementById("menuPanels").innerHTML = menuKeys.map((k,i)=>`
    <div class="menu-panel ${i===0?'active':''}" data-panel="${k}">
      ${MENU[k].items.map(it=>`
        <div class="menu-item">
          <div><div class="menu-item-name">${it.name}</div><div class="menu-item-desc">${bi(it.desc)}</div></div>
          <div class="menu-item-price">${it.price}</div>
        </div>
      `).join("")}
    </div>
  `).join("");
  document.querySelectorAll(".menu-tab").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      document.querySelectorAll(".menu-tab").forEach(b=>b.setAttribute("aria-selected", b===btn));
      document.querySelectorAll(".menu-panel").forEach(p=>p.classList.toggle("active", p.dataset.panel===btn.dataset.key));
    });
  });

  // location tabs
  document.getElementById("locTabs").innerHTML = LOCATIONS.map((loc,i)=>`
    <button class="loc-tab" role="tab" aria-selected="${i===0}" data-idx="${i}">${loc.label}</button>
  `).join("");
  document.getElementById("locPanels").innerHTML = LOCATIONS.map((loc,i)=>`
    <div class="loc-panel ${i===0?'active':''}" data-panel="${i}">
      <div>
        <span class="eyebrow" style="margin-bottom:10px;">${loc.area}</span>
        <address>${loc.address}</address>
        <div class="loc-hours">🕐 ${loc.hours}</div>
        <div class="loc-walkin">🚶 <span>${lang==='it' ? 'No Reservation, Just Walk in' : 'No Reservation, Just Walk In'}</span></div>
        <br>
        <a class="btn btn-dark" href="https://maps.google.com/maps?q=${encodeURIComponent(loc.address)}" target="_blank" rel="noopener">${lang==='it'?'Apri in Maps':'Open in Maps'}</a>
      </div>
      <div class="loc-map-visual" aria-hidden="true"><div class="loc-pin"></div></div>
    </div>
  `).join("");
  document.querySelectorAll(".loc-tab").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      document.querySelectorAll(".loc-tab").forEach(b=>b.setAttribute("aria-selected", b===btn));
      document.querySelectorAll(".loc-panel").forEach(p=>p.classList.toggle("active", p.dataset.panel===btn.dataset.idx));
    });
  });

  // crowd chart
  const recWord = lang==='it' ? {low:'Bassa affluenza ora',med:'Affluenza media ora',high:'Alta affluenza ora'} : {low:'Quiet right now',med:'Moderate right now',high:'Busy right now'};
  document.getElementById("crowdChart").innerHTML = CROWD.map(c=>{
    const heights = {low:'25%',med:'55%',high:'95%'};
    return `<div class="crowd-bar ${c.l}" style="height:${heights[c.l]}" title="${c.h} — ${c.l}"><span class="lbl">${c.h.replace(':00','')}</span></div>`;
  }).join("");
  // pick a representative "best time" hint (first low slot after 14:00)
  const bestSlot = CROWD.find(c=>c.l==='low' && parseInt(c.h)>=15) || CROWD.find(c=>c.l==='low');
  document.getElementById("filaRec").textContent = lang==='it'
    ? `Miglior momento: dopo le ${bestSlot.h}`
    : `Best time: after ${bestSlot.h}`;

  // tripadvisor
  document.getElementById("tripadvisorBtn").href = "https://www.tripadvisor.it/Restaurant_Review-g187791-d13443832-Reviews-Tonnarello-Rome_Lazio.html";
}

document.querySelectorAll(".langswitch button").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    lang = btn.dataset.lang;
    document.querySelectorAll(".langswitch button").forEach(b=>b.setAttribute("aria-pressed", String(b===btn)));
    renderStatic();
  });
});

const io = new IntersectionObserver((entries)=>{ entries.forEach(e=>{ if(e.isIntersecting) e.target.classList.add("in"); }); }, {threshold:0.12});
document.querySelectorAll(".fade-up").forEach(el=>io.observe(el));

renderStatic();
</script>
